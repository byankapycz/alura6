<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Aventura Interativa</title>

<style>
* {
margin: 0;
padding: 0;
box-sizing: border-box;
font-family: Arial, sans-serif;
}

body {
background: linear-gradient(135deg, #172b35, #315b50);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
}

.container {
background: white;
max-width: 650px;
width: 100%;
padding: 35px;
border-radius: 18px;
text-align: center;
box-shadow: 0 8px 25px #0005;
}

h1 {
color: #245b46;
margin-bottom: 15px;
}

.imagem {
font-size: 65px;
margin: 20px;
}

#historia {
font-size: 18px;
color: #333;
line-height: 1.6;
margin: 25px 0;
}

.opcoes {
display: flex;
flex-direction: column;
gap: 12px;
}

button {
background: #287a57;
color: white;
border: none;
padding: 15px;
border-radius: 9px;
font-size: 16px;
cursor: pointer;
transition: 0.3s;
}

button:hover {
background: #174c36;
transform: scale(1.02);
}

.reiniciar {
background: #d18a32;
margin-top: 20px;
}

.reiniciar:hover {
background: #a9681c;
}

footer {
margin-top: 25px;
color: #777;
font-size: 13px;
}

</style>
</head>

<body>

<main class="container">

<h1>🌳 A Floresta Misteriosa</h1>

<p>Uma aventura onde suas escolhas definem seu destino!</p>

<div class="imagem" id="imagem">🌲</div>

<div id="historia">
Você acordou em uma floresta desconhecida.
Existem dois caminhos à sua frente.
Qual será sua escolha?
</div>

<div class="opcoes" id="opcoes">

<button data-escolha="esquerda">
🌿 Seguir pelo caminho da esquerda
</button>

<button data-escolha="direita">
🏞️ Seguir pelo caminho da direita
</button>

</div>

<button class="reiniciar" id="reiniciar">
🔄 Reiniciar aventura
</button>

<footer>
Projeto desenvolvido para a atividade Start by Alura.
</footer>

</main>

<script>

// Elementos da página
const historia = document.getElementById("historia");
const opcoes = document.getElementById("opcoes");
const imagem = document.getElementById("imagem");
const reiniciar = document.getElementById("reiniciar");

// Dados das histórias
const aventuras = {

inicio: {
texto: "Você acordou em uma floresta desconhecida. Existem dois caminhos à sua frente. Qual será sua escolha?",
imagem: "🌲",
escolhas: [
{ texto: "🌿 Seguir pela esquerda", destino: "rio" },
{ texto: "🏞️ Seguir pela direita", destino: "caverna" }
]
},

rio: {
texto: "Você encontrou um rio de águas cristalinas. Do outro lado existe uma pequena ponte. O que deseja fazer?",
imagem: "🌊",
escolhas: [
{ texto: "🌉 Atravessar a ponte", destino: "tesouro" },
{ texto: "🌳 Voltar para a floresta", destino: "floresta" }
]
},

caverna: {
texto: "Você encontrou uma caverna misteriosa. Lá dentro existe uma luz brilhante. Você decide explorar?",
imagem: "🪨",
escolhas: [
{ texto: "✨ Entrar na caverna", destino: "tesouro" },
{ texto: "🚶 Voltar pelo caminho", destino: "floresta" }
]
},

floresta: {
texto: "Você voltou para a floresta e encontrou uma trilha escondida que leva até uma cachoeira.",
imagem: "🌳",
escolhas: [
{ texto: "💧 Explorar a cachoeira", destino: "tesouro" },
{ texto: "🏠 Procurar a saída", destino: "final" }
]
},

tesouro: {
texto: "Parabéns! Você encontrou um antigo tesouro escondido na floresta. Sua coragem e curiosidade ajudaram você a chegar até aqui!",
imagem: "💎",
escolhas: [
{ texto: "🏠 Voltar para casa", destino: "final" },
{ texto: "🔎 Continuar explorando", destino: "floresta" }
]
},

final: {
texto: "A aventura chegou ao fim! Você conseguiu encontrar o caminho de volta para casa. Obrigado por participar dessa jornada!",
imagem: "🏡",
escolhas: []
}

};

// Função para apresentar cada etapa
function mostrarHistoria(etapa) {

const atual = aventuras[etapa];

historia.textContent = atual.texto;

imagem.textContent = atual.imagem;

opcoes.innerHTML = "";

// Percorre as escolhas usando forEach
atual.escolhas.forEach(function(escolha) {

const botao = document.createElement("button");

botao.textContent = escolha.texto;

botao.dataset.destino = escolha.destino;

opcoes.appendChild(botao);

});

// Adiciona eventos aos botões
const botoes = opcoes.querySelectorAll("button");

botoes.forEach(function(botao) {

botao.addEventListener("click", function() {

const destino = botao.dataset.destino;

mostrarHistoria(destino);

});

});

}

// Evento para reiniciar a aventura
reiniciar.addEventListener("click", function() {

mostrarHistoria("inicio");

});

// Inicia o jogo
mostrarHistoria("inicio");

</script>

</body>
</html>
